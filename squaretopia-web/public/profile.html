<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squaretopia Profile</title>
    <!-- All styling lives in style.css so this page and the profile page stay consistent. -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="topbar">
        <div class="brand">SQUARE<span>TOPIA</span></div>
        <div class="topnav">
            <a href="index.html">Home</a>
        </div>
        <div class="topbar-user"><a href="index.html">Back to dashboard</a></div>
    </div>

    <div class="wrap-narrow">

        <!-- PROFILE -->
        <!-- Shows one player. The username comes from the link, and the backend looks them up in the hash table. -->

        <div class="panel">
            <div class="panel-head">Player Profile</div>
            <div class="panel-body-wide" id="profile-body">
                <p class="notice">Loading profile...</p>
            </div>
        </div>

        <!-- BIO EDITOR -->
        <!-- Only shown when the profile being viewed is your own account. -->

        <div class="panel hidden" id="edit-panel">
            <div class="panel-head">Edit Your Bio</div>
            <div class="panel-body-wide">
                <textarea id="bio-input" maxlength="200" placeholder="Say something about yourself" oninput="updateCount()"></textarea>
                <div class="char-count"><span id="char-count">0</span> / 200</div>
                <div class="spacer"></div>
                <button class="btn-blue" onclick="saveBio()">SAVE BIO</button>
                <button class="btn-grey" onclick="location.href='index.html'">BACK</button>
                <span id="save-msg" class="save-msg"></span>
            </div>
        </div>

    </div>

    <script>

        // Who is signed in, and which profile this page was asked to show.

        const loggedInUser = localStorage.getItem("squaretopia_user");
        const params = new URLSearchParams(window.location.search);
        const viewingUser = params.get('user');

        // Ask the backend for this player, then draw them.
        // If the link has no username on it, or the account does not exist, we say so
        // instead of showing an empty page.

        window.onload = function() {
            if (!viewingUser) {
                showNotice("No player was specified.");
                return;
            }
            loadProfile();
        };

        async function loadProfile() {
            try {
                const response = await fetch('/api/profile/' + encodeURIComponent(viewingUser));

                if (response.status === 404) {
                    showNotice("That player does not exist.");
                    return;
                }
                if (!response.ok) {
                    showNotice("Could not load that profile.");
                    return;
                }

                const data = await response.json();
                renderProfile(data);
            } catch (err) {
                showNotice("Could not reach the server.");
            }
        }

        // Draws the profile.
        // Same rule as the dashboard, everything the player controls is written with
        // textContent so a username or bio cannot inject HTML into the page.

        function renderProfile(data) {
            const body = document.getElementById('profile-body');
            body.replaceChildren();

            const top = document.createElement('div');
            top.className = 'profile-top';

            const square = document.createElement('div');
            square.className = 'profile-square';
            const validColor = /^#[0-9a-fA-F]{6}$/.test(data.color || "");
            if (validColor) {
                square.style.backgroundColor = data.color;
            }

            const info = document.createElement('div');
            info.className = 'profile-info';

            const name = document.createElement('h1');
            name.className = 'profile-name';
            name.textContent = data.username;

            const meta = document.createElement('div');
            meta.className = 'profile-meta';
            meta.textContent = (data.username === loggedInUser) ? "This is your profile" : "Squaretopia member";

            const bio = document.createElement('div');
            bio.className = 'profile-bio';
            bio.textContent = data.bio && data.bio.trim().length > 0 ? data.bio : "This player has not written a bio yet.";

            info.append(name, meta, bio);

            // The color they are currently wearing in the client.

            const swatchRow = document.createElement('div');
            swatchRow.className = 'swatch-row';
            const chip = document.createElement('span');
            chip.className = 'swatch-chip';
            if (validColor) chip.style.backgroundColor = data.color;
            const label = document.createElement('span');
            label.textContent = "Square color: " + (validColor ? data.color : "not set");
            swatchRow.append(chip, label);
            info.append(swatchRow);

            top.append(square, info);
            body.append(top);

            // Only your own profile gets the editor. Somebody else's gets the add friend button instead.

            if (data.username === loggedInUser) {
                document.getElementById('edit-panel').classList.remove('hidden');
                document.getElementById('bio-input').value = data.bio || "";
                updateCount();
            }
            else if (loggedInUser) {
                const btn = document.createElement('button');
                btn.className = 'btn-blue';
                btn.id = 'follow-btn';
                btn.textContent = 'FOLLOW';

                const msg = document.createElement('span');
                msg.className = 'save-msg';
                msg.id = 'follow-msg';

                const row = document.createElement('div');
                row.className = 'spacer';
                body.append(row, btn, msg);

                // Ask the server whether we already follow them, and whether they
                // follow us, so the button says the right thing before it is clicked.
                
                loadFollowStatus(data.username);
            }
        }

        function showNotice(text) {
            const body = document.getElementById('profile-body');
            body.replaceChildren();
            const p = document.createElement('p');
            p.className = 'notice';
            p.textContent = text;
            body.append(p);
        }

        // Saves the bio, then redraws so what you see is what actually got stored.

        async function saveBio() {
            const bio = document.getElementById('bio-input').value;
            const saveMsg = document.getElementById('save-msg');

            try {
                // The server takes our identity from the token, so the bio we send
                // can only ever be our own.
                const response = await fetch('/api/update-bio', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem("squaretopia_token")
                    },
                    body: JSON.stringify({ bio: bio })
                });

                if (response.status === 401) {
                    saveMsg.style.color = '#ff6b6b';
                    saveMsg.textContent = "Session expired, log in again.";
                    return;
                }

                if (!response.ok) {
                    saveMsg.style.color = '#ff6b6b';
                    saveMsg.textContent = "Could not save.";
                    return;
                }

                saveMsg.style.color = '#6bff6b';
                saveMsg.textContent = "Saved!";
                loadProfile();
            } catch (err) {
                saveMsg.style.color = '#ff6b6b';
                saveMsg.textContent = "Could not reach the server.";
            }
        }

        // Works out what the follow button should say. The server tells us both
        // directions, so we can also show when two players follow each other.

        let alreadyFollowing = false;

        async function loadFollowStatus(username) {
            const btn = document.getElementById('follow-btn');
            const msg = document.getElementById('follow-msg');

            try {
                const response = await fetch('/api/follow-status/' + encodeURIComponent(username), {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem("squaretopia_token") }
                });
                if (!response.ok) return;

                const data = await response.json();
                alreadyFollowing = data.iFollow;

                btn.textContent = alreadyFollowing ? 'UNFOLLOW' : 'FOLLOW';
                btn.onclick = () => toggleFollow(username);

                if (data.followsMe) {
                    msg.style.color = '#888';
                    msg.textContent = alreadyFollowing ? "You follow each other" : "Follows you";
                }
            } catch (err) {
                console.log("Could not load follow status", err);
            }
        }

        // Follows or unfollows depending on where we currently stand. The server
        // takes who is doing the following from the token, we only say who.

        async function toggleFollow(username) {
            const btn = document.getElementById('follow-btn');
            const msg = document.getElementById('follow-msg');
            const route = alreadyFollowing ? '/api/unfollow' : '/api/follow';

            try {
                const response = await fetch(route, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem("squaretopia_token")
                    },
                    body: JSON.stringify({ target: username })
                });

                const data = await response.json();

                if (!response.ok) {
                    msg.style.color = '#ff6b6b';
                    msg.textContent = data.error || "Could not do that.";
                    return;
                }

                alreadyFollowing = !alreadyFollowing;
                btn.textContent = alreadyFollowing ? 'UNFOLLOW' : 'FOLLOW';
                msg.style.color = '#6bff6b';
                msg.textContent = alreadyFollowing ? "Following!" : "Unfollowed.";
            } catch (err) {
                msg.style.color = '#ff6b6b';
                msg.textContent = "Could not reach the server.";
            }
        }

        function updateCount() {
            document.getElementById('char-count').textContent = document.getElementById('bio-input').value.length;
        }
    </script>
</body>
</html>
